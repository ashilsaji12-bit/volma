<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Volunteer Management System for college events, activities, and community programs by Group 12 (S3 CSE DS).">
  <title>Volunteer Management System | College Project</title>
  
  <!-- Modern Inter Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Design System CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Mobile Sidebar Backdrop -->
  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

  <div class="app-layout">
    
    <!-- Sidebar Navigation -->
    <aside id="app-sidebar" class="app-sidebar">
      <div class="sidebar-header">
        <div class="brand-icon">V</div>
        <div>
          <div class="brand-title">VolunteerMS</div>
          <div class="brand-subtitle">Campus & Community</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="#dashboard" class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
          <span>Dashboard</span>
        </a>

        <a href="#volunteers" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <span>Volunteers</span>
        </a>

        <a href="#activities" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          <span>Activities</span>
        </a>

        <a href="#tasks" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
          <span>Tasks</span>
        </a>

        <a href="#assignments" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><polyline points="17 11 19 13 23 9"></polyline></svg>
          <span>Assignments</span>
        </a>

        <a href="#reports" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          <span>Reports & CSV</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="project-meta-pill">
          <strong>Group 12 &bull; S3 CSE DS</strong>
          <span>Aadhi, Anusree, Sooraj, George</span>
        </div>
        <button id="btn-about-project" class="btn btn-ghost btn-sm" style="width: 100%; margin-top: 0.5rem; justify-content: flex-start; font-size: 0.75rem;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
          About & Viva Concepts
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="app-main">
      
      <!-- Top Application Header -->
      <header class="app-header">
        <div class="header-left">
          <button id="mobile-menu-btn" class="mobile-menu-btn btn-icon" aria-label="Toggle navigation menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <h1 id="page-header-title" class="page-header-title">Dashboard</h1>
        </div>

        <div class="header-right">
          <!-- Dark / Light Mode Toggle Button -->
          <button id="theme-toggle-btn" class="btn-icon" aria-label="Toggle dark/light theme" title="Toggle Theme">
            <svg id="theme-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>

          <!-- About Project Button -->
          <button id="header-about-btn" class="btn btn-secondary btn-sm">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
            About Team
          </button>
        </div>
      </header>

      <!-- View Containers -->
      <div class="page-container">
        <section id="view-dashboard" class="view-section active"></section>
        <section id="view-volunteers" class="view-section"></section>
        <section id="view-activities" class="view-section"></section>
        <section id="view-tasks" class="view-section"></section>
        <section id="view-assignments" class="view-section"></section>
        <section id="view-reports" class="view-section"></section>
      </div>

    </main>

  </div>

  <!-- Entry Script (Compatible with both file:// protocol and HTTP servers) -->
  <script src="js/vms.js"></script>
</body>
</html>
